spring.application.name=pizzariaf
server.port=8080
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=pizzariaNeymar_db;integratedSecurity=false;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=@ITB123456
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect


# Informações:

# integratedSecurity: (true) Indica que a conexão será feita com as credenciais do Windows (false) Credencial do SQL SERVER
# encrypt: (true) Requer criptografia do Cliente (false) Não requer criptografia do Cliente
# trustServerCertificate: (true) Instruir o aplicativo cliente a ignorar a validação do certificado SSL/TSL do servidor